spring.application.name=backend

# Base de control (ADR 0007): registro de tenants, no datos de municipios.
# Las bases por tenant llegan en R2.
spring.datasource.url=jdbc:postgresql://localhost:5432/ciudad_control
spring.datasource.username=ciudad
spring.datasource.password=ciudad

# El esquema lo maneja Flyway; Hibernate no toca la estructura.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/control
