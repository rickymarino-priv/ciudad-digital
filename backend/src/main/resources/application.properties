spring.application.name=backend

# --- Base de control (ADR 0007) ---
# Registro de tenants. No guarda datos de municipios: cada municipio tiene
# su propia base (ADR 0001).
ciudad.control.url=jdbc:postgresql://localhost:5432/ciudad_control
ciudad.control.usuario=ciudad
ciudad.control.password=ciudad

# --- Bases de tenant (ADR 0005) ---
# Todas viven como bases lógicas en el mismo motor, con credenciales
# compartidas a nivel aplicación: por eso alcanza con guardar el nombre de
# la base en la fila del tenant, sin credenciales por municipio.
ciudad.tenants.servidor=jdbc:postgresql://localhost:5432/
ciudad.tenants.usuario=ciudad
ciudad.tenants.password=ciudad
# Base contra la que se conecta para ejecutar CREATE DATABASE, que no puede
# correr dentro de la base que se está creando.
ciudad.tenants.base-de-mantenimiento=postgres
ciudad.tenants.tamano-de-pool=5

# --- API de administración ---
# Medida provisoria de R2: el alta de municipios es una superficie
# cross-tenant y la autenticación real llega en R3. Sin esto, cualquiera
# podría dar de alta municipios.
ciudad.admin.token=cambiar-en-r3

# Flyway migra la base de control al arrancar. Las bases de municipio se
# migran en el alta, no acá: no existen hasta que hay un municipio.
spring.flyway.locations=classpath:db/control

spring.jpa.open-in-view=false
