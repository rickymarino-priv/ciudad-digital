services:
  postgres:
    image: postgres:16-alpine
    container_name: ciudad-digital-postgres
    environment:
      POSTGRES_USER: ciudad
      POSTGRES_PASSWORD: ciudad
      # Base de control: registro de tenants y su configuración.
      # Las bases por municipio se crean en R2 (aprovisionamiento).
      POSTGRES_DB: ciudad_control
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ciudad -d ciudad_control"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit
    container_name: ciudad-digital-mailpit
    # Servidor SMTP falso para desarrollo (ADR 0013 §3): el email de
    # bienvenida del módulo notificaciones se manda acá, no a una casilla
    # real. Puerto 1025 para SMTP (spring.mail.host/port), 8025 para la
    # bandeja web donde se ve lo enviado.
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres-data:
