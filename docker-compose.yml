services:
  postgres:
    image: postgres:16-alpine
    container_name: ciudad-digital-postgres
    environment:
      POSTGRES_USER: ciudad
      POSTGRES_PASSWORD: ciudad
      # Base de control: registro de tenants y su configuración.
      # Las bases por municipio se crean en R2 (aprovisionamiento).
      POSTGRES_DB: ciudad_control
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ciudad -d ciudad_control"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
